<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkAssist · 悬浮球</title>
  <style>
    /* 窗口本身被裁成圆形(由桌面端 SetWindowRgn 完成),这里让球体铺满整窗,避免露出方形底色 */
    :root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #243f3c; overflow: hidden; user-select: none; }
    #ball {
      position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 50%;
      background: radial-gradient(circle at 32% 26%, #35605a, #1e3b38 70%);
      color: #bdf0e4; display: grid; place-items: center; cursor: pointer;
      box-shadow: inset 0 0 0 2px rgba(133, 212, 195, .55);
      transition: background .18s, color .18s, box-shadow .18s;
    }
    #ball.off { background: radial-gradient(circle at 32% 26%, #3d4f55, #22302f 72%); color: #a9bcc0; box-shadow: inset 0 0 0 2px rgba(150, 170, 178, .38); }
    #ball:hover { background: radial-gradient(circle at 32% 26%, #3f736a, #234540 70%); color: #d9fff5; }
    #ball:active { background: radial-gradient(circle at 32% 26%, #2c5a52, #1a3431 70%); }
    #ball:focus-visible { box-shadow: inset 0 0 0 3px #d7fff3; }
    .mark { width: 42%; height: 42%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    #status { position: absolute; right: 16%; bottom: 16%; width: 15%; height: 15%; max-width: 13px; max-height: 13px; min-width: 9px; min-height: 9px; border-radius: 50%; background: #2cd3aa; border: 2px solid #1e3b38; pointer-events: none; }
    #ball.off #status { background: #8fa3ab; border-color: #22302f; }
    #badge { position: absolute; top: 11%; right: 11%; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 10px; background: #0b8f78; color: #fff; font-size: 10px; font-weight: 700; line-height: 19px; text-align: center; pointer-events: none; box-shadow: 0 1px 4px rgb(8 40 34 / 45%); }
    [hidden] { display: none !important; }
    #ball.unread { box-shadow: inset 0 0 0 3px #a2ead4; }
    @media (prefers-reduced-motion: reduce) { #ball { transition: none; } }
  </style>
</head>
<body>
  <button id="ball" class="off pywebview-drag-region" type="button" aria-label="打开迷你面板，正在连接本机服务" title="互传助手 · 正在连接本机服务。点击打开迷你面板，拖动移动，右键打开主窗口。">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 7-1 1a4.25 4.25 0 0 1-6-6l4-4a4.25 4.25 0 0 1 6 0m2 1 1-1a4.25 4.25 0 0 1 6 6l-4 4a4.25 4.25 0 0 1-6 0" transform="translate(1 0)"/></svg>
    <span id="status" aria-hidden="true"></span><span id="badge" hidden aria-hidden="true"></span>
  </button>
  <script>
    'use strict';
    const ball = document.getElementById('ball'), badge = document.getElementById('badge');
    let unread = 0, online = false, service = false, socket, retryTimer, retryDelay = 1000, handshake;
    let start = null, moved = false, busy = false;
    function describe(extra = '') {
      const state = !service ? '本机服务未连接' : online ? '设备已连接' : '等待设备连接';
      ball.classList.toggle('off', !service || !online); ball.classList.toggle('unread', unread > 0);
      badge.hidden = unread === 0; badge.textContent = unread > 99 ? '99+' : String(unread);
      ball.setAttribute('aria-label', `打开迷你面板，${state}${unread ? `，${unread} 条未读消息` : ''}`);
      ball.title = extra || `互传助手 · ${state}${unread ? ` · ${unread} 条未读` : ''}。点击打开迷你面板，拖动移动，右键打开主窗口。`;
    }
    function reconnect() {
      service = false; online = false; describe(); clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, retryDelay); retryDelay = Math.min(retryDelay * 2, 15000);
    }
    function connect() {
      clearTimeout(retryTimer); clearTimeout(handshake);
      if (!['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname)) return describe('悬浮球仅供本机桌面使用。');
      let ws; try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); socket = ws; } catch (_) { return reconnect(); }
      handshake = setTimeout(() => { if (socket === ws && !service) ws.close(); }, 12000);
      ws.onmessage = event => {
        if (socket !== ws) return;
        let data; try { data = JSON.parse(event.data); } catch (_) { return; }
        if (!data) return;
        if (data.type === 'init' || data.type === 'status') {
          service = true; retryDelay = 1000; clearTimeout(handshake);
          online = Array.isArray(data.deviceInfos) ? data.deviceInfos.some(d => d && d.online !== false) : !!data.connected;
        } else if (data.type === 'msg' && data.message?.direction !== 'out') unread++;
        else if (data.type === 'cleared') unread = 0;
        describe();
      };
      ws.onerror = () => ws.close(); ws.onclose = () => { if (socket === ws) { clearTimeout(handshake); reconnect(); } };
    }
    /* 左键:打开独立迷你面板(不展开主窗口);右键:打开主窗口 */
    async function openMini() {
      if (busy) return; const api = window.pywebview?.api;
      if (!api?.open_mini) return describe('桌面桥接尚未就绪，请稍后再点击。');
      busy = true;
      try { if (await api.open_mini()) unread = 0; else describe('迷你面板打开失败，可右键打开主窗口。'); describe(); }
      catch (_) { describe('暂时无法打开迷你面板，请右键打开主窗口。'); }
      finally { busy = false; }
    }
    async function openMain() {
      const api = window.pywebview?.api;
      if (!api?.show_main) return describe('桌面桥接尚未就绪，请稍后再点击。');
      try { await api.show_main(); unread = 0; describe('已打开主窗口。'); }
      catch (_) { describe('暂时无法打开主窗口，请从系统托盘恢复。'); }
    }
    ball.addEventListener('mousedown', event => { if (event.button === 0) { start = [event.screenX, event.screenY]; moved = false; } });
    window.addEventListener('mousemove', event => {
      if (!start || moved || !(event.buttons & 1)) return;
      if (Math.hypot(event.screenX - start[0], event.screenY - start[1]) > 6) { moved = true; }
    });
    window.addEventListener('mouseup', () => { start = null; });
    window.addEventListener('blur', () => { start = null; });
    ball.addEventListener('click', event => { if (event.detail === 0 || !moved) openMini(); moved = false; });
    ball.addEventListener('contextmenu', event => { event.preventDefault(); openMain(); });
    connect();
  </script>
</body>
</html>
