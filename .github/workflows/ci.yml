name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PC dependencies
        run: python -m pip install -r pc/requirements.txt -r pc/requirements-dev.txt
      - name: Run PC tests (pairing, transfers, updates, stability)
        run: python -m pytest -q

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon
